<path d="M70 205 H530" stroke="#2acbd6" stroke-opacity=".45" stroke-width="2"/>
<text x="300" y="290" fill="#fff" font-size="43" font-weight="900">SUPPORT</text><text x="300" y="345" fill="#fff" font-size="43" font-weight="900">LOCAL SAFETY.</text>
<text x="300" y="405" fill="#cce8f1" font-size="25">Help keep Brevard</text><text x="300" y="442" fill="#cce8f1" font-size="25">communities informed</text><text x="300" y="479" fill="#cce8f1" font-size="25">and prepared.</text>
