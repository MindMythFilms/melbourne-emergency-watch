<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1000" viewBox="0 0 600 1000" role="img" aria-labelledby="t d">
<title id="t">CoastWatch FL — Desktop community partner</title><desc id="d">Tall animated sponsorship creative for the CoastWatch FL desktop map sidebar.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#07182f"/><stop offset=".55" stop-color="#10476a"/><stop offset="1" stop-color="#061a2d"/></linearGradient><linearGradient id="aqua"><stop stop-color="#087da5"/><stop offset=".5" stop-color="#1bd5df"/><stop offset="1" stop-color="#087da5"/></linearGradient><linearGradient id="gold"><stop stop-color="#d49a34"/><stop offset=".5" stop-color="#fff0b2"/><stop offset="1" stop-color="#d49a34"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
