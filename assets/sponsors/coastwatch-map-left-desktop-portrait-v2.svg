<svg xmlns="http://www.w3.org/2000/svg" width="350" height="1000" viewBox="0 0 350 1000" role="img" aria-labelledby="title desc">
<title id="title">CoastWatch FL community sponsor</title>
<desc id="desc">Tall animated CoastWatch FL sponsor artwork with coastal imagery, weather, road and shelter symbols, and a sponsor call to action.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="0.9" y2="1"><stop stop-color="#071a30"/><stop offset=".48" stop-color="#0b3450"/><stop offset="1" stop-color="#041522"/></linearGradient>
 <linearGradient id="sea" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#087da5"/><stop offset=".5" stop-color="#19d4df"/><stop offset="1" stop-color="#075070"/></linearGradient>
 <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#d69b3a"/><stop offset=".5" stop-color="#fff0b5"/><stop offset="1" stop-color="#d7a342"/></linearGradient>
 <radialGradient id="glow"><stop stop-color="#11c9d9" stop-opacity=".28"/><stop offset="1" stop-color="#11c9d9" stop-opacity="0"/></radialGradient>
 <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="goldGlow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="350" height="1000" fill="url(#bg)"/>
<circle cx="175" cy="245" r="210" fill="url(#glow)"><animate attributeName="r" values="190;225;190" dur="6s" repeatCount="indefinite"/></circle>
<path d="M0 0H350V1000H0Z" fill="none" stroke="#17c4d3" stroke-opacity=".45" stroke-width="2"/>
<!-- Coastal signal / lighthouse mark -->
<g transform="translate(175 150)">
 <circle r="103" fill="none" stroke="#14c9d8" stroke-opacity=".18" stroke-width="2"/>
 <circle r="82" fill="none" stroke="#14c9d8" stroke-opacity=".28" stroke-width="2"><animate attributeName="r" values="70;92;70" dur="5s" repeatCount="indefinite"/></circle>
 <path d="M-105 25 Q-58 -18 -12 20 T82 15" fill="none" stroke="url(#sea)" stroke-width="9" stroke-linecap="round"/>
 <path d="M-95 48 Q-47 7 0 45 T92 38" fill="none" stroke="#0aa9c8" stroke-width="5" stroke-linecap="round"/>
 <path d="M24 -54 L35 -54 L41 15 L18 15Z" fill="#eef7f7" stroke="#9ac6d0" stroke-width="2"/>
 <path d="M22 -58H37L33 -70H26Z" fill="#f6d58e"/><path d="M23 -50H37" stroke="#0c3650" stroke-width="4"/>
 <path d="M35 -58L100 -88L100 -28Z" fill="#f9d889" opacity=".22"><animate attributeName="opacity" values=".08;.35;.08" dur="3s" repeatCount="indefinite"/></path>
 <path d="M35 -58L104 -76" stroke="#f7d78e" stroke-width="2" opacity=".7"/>
 <path d="M-57 -48Q-34 -72 -10 -48" fill="none" stroke="#18cbd9" stroke-width="5" stroke-linecap="round"/>
 <path d="M-42 -68Q-31 -83 -20 -68" fill="none" stroke="#18cbd9" stroke-width="4" stroke-linecap="round"/>
</g>
<g font-family="Arial,sans-serif" text-anchor="middle">
 <text x="175" y="305" fill="#ffffff" font-size="31" font-weight="900" letter-spacing="1.1">COASTWATCH <tspan fill="#23d8e2">FL</tspan></text>
 <text x="175" y="351" fill="#ffffff" font-size="29" font-weight="900">SUPPORT</text>
 <text x="175" y="390" fill="#27d6e2" font-size="29" font-weight="900">LOCAL SAFETY.</text>
 <text x="175" y="438" fill="#d5eaf0" font-size="18">Help keep Brevard</text>
 <text x="175" y="465" fill="#d5eaf0" font-size="18">communities informed</text>
 <text x="175" y="492" fill="#d5eaf0" font-size="18">and prepared.</text>
</g>
<!-- Three useful service symbols -->
<g transform="translate(0 550)" font-family="Arial,sans-serif" text-anchor="middle">
 <g>
  <rect x="13" y="0" width="100" height="116" rx="13" fill="#082b42" stroke="#16bccc" stroke-opacity=".7"/>
  <path d="M42 42Q42 28 56 28Q69 28 70 40Q83 42 80 56H38Q30 51 34 44Z" fill="#22d5e0"/>
  <path d="M59 42L50 58H60L55 73L71 53H61L66 42Z" fill="#f6d17e"/>
  <text x="63" y="94" fill="#e9f7fa" font-size="13" font-weight="700">WEATHER</text>
 </g>
 <g>
  <rect x="125" y="0" width="100" height="116" rx="13" fill="#082b42" stroke="#16bccc" stroke-opacity=".7"/>
  <path d="M173 23L195 77H151Z" fill="#f4a92f" stroke="#ffe5a4" stroke-width="2"/>
  <path d="M161 49H185M156 64H190" stroke="#fff7e3" stroke-width="7"/>
  <text x="175" y="94" fill="#e9f7fa" font-size="13" font-weight="700">ROAD</text>
 </g>
 <g>
  <rect x="237" y="0" width="100" height="116" rx="13" fill="#082b42" stroke="#16bccc" stroke-opacity=".7"/>
  <path d="M259 52L287 29L315 52V78H295V59H279V78H259Z" fill="none" stroke="#25d4df" stroke-width="6" stroke-linejoin="round"/>
  <text x="287" y="94" fill="#e9f7fa" font-size="13" font-weight="700">SHELTERS</text>
 </g>
</g>
<!-- Florida coastline / illuminated water -->
<g transform="translate(0 700)">
 <path d="M0 62Q55 27 105 59T210 54T350 45V190H0Z" fill="#05243b"/>
 <path d="M0 70Q55 35 105 67T210 62T350 53" fill="none" stroke="url(#sea)" stroke-width="5"><animate attributeName="d" values="M0 70Q55 35 105 67T210 62T350 53;M0 70Q55 92 105 58T210 75T350 53;M0 70Q55 35 105 67T210 62T350 53" dur="6s" repeatCount="indefinite"/></path>
 <path d="M25 110Q92 74 150 111T300 106" fill="none" stroke="#19cbd8" stroke-opacity=".35" stroke-width="2"/>
 <circle cx="275" cy="88" r="5" fill="#ffe2a1" filter="url(#softGlow)"><animate attributeName="opacity" values=".25;1;.25" dur="2.4s" repeatCount="indefinite"/></circle>
 <circle cx="88" cy="126" r="3" fill="#ffe2a1"><animate attributeName="opacity" values="1;.3;1" dur="3s" repeatCount="indefinite"/></circle>
</g>
<g font-family="Arial,sans-serif" text-anchor="middle">
 <text x="175" y="866" fill="#aeeaf0" font-size="14" font-weight="800" letter-spacing="1.4">YOUR BUSINESS MAKES A DIFFERENCE</text>
 <rect x="28" y="892" width="294" height="66" rx="33" fill="url(#gold)" stroke="#fff1bd" stroke-width="2" filter="url(#goldGlow)"><animate attributeName="opacity" values="1;.88;1" dur="2.8s" repeatCount="indefinite"/></rect>
 <text x="175" y="933" fill="#102c40" font-size="19" font-weight="900">BECOME A SPONSOR</text>
 <text x="175" y="982" fill="#91cbd7" font-size="11" letter-spacing="1.3">LOCAL PARTNERS · STRONGER COMMUNITIES</text>
</g>
</svg>